name: Refresh spice prices

# Keeps the La-kera Firestore `prices` collection fresh with Kerala
# mandi modal prices from KisanDeals (which republishes Agmarknet/eNAM
# APMC data). NOTE: this workflow currently cannot fetch successfully
# from GitHub-hosted runners (data.gov.in geo-blocks non-India IPs and
# KisanDeals 403s datacenter IPs — verified 2026-10-01), so it is
# MANUAL-ONLY as a placeholder. Prices are refreshed on a schedule by
# Bodhi instead (cron la-kera-price-refresh, Mon/Thu).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install firebase-admin requests curl_cffi

      - name: Refresh prices
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python tools/refresh_prices.py
